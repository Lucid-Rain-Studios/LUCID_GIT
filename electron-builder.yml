appId: com.lucidrainstudios.lucidgit
productName: Lucid Git
copyright: Copyright © 2026 Lucid Rain Studios

directories:
  output: Build
  buildResources: assets

files:
  - "dist-electron/**/*"
  - "dist-renderer/**/*"
  - "package.json"

extraResources:
  - from: assets/icon.png
    to: assets/icon.png
  - from: assets/icon.ico
    to: assets/icon.ico

# Native modules + bundled Git must live outside the ASAR archive
asarUnpack:
  - "node_modules/dugite/**/*"
  - "node_modules/keytar/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/sharp/**/*"

# Versioned filenames make GitHub Releases clean
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# Re-signs mac builds ad-hoc when no Developer ID identity is configured —
# electron-builder otherwise leaves a stale signature that won't launch.
afterSign: scripts/afterSign.js

compression: maximum

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker   # install to AppData, no UAC prompt
  # Keep executable editing disabled on Windows hosts without symlink privileges;
  # the NSIS script below sets Lucid Git's desktop shortcut icon explicitly.
  signAndEditExecutable: false

nsis:
  include: assets/installer.nsh
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lucid Git
  # Windows code-signing — configure secrets in GitHub when ready:
  # signingHashAlgorithms: [sha256]
  # certificateFile: ${CSC_LINK}
  # certificatePassword: ${CSC_KEY_PASSWORD}

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]          # Intel + Apple Silicon
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  # Unsigned/un-notarized for now — no paid Apple Developer Program membership yet.
  # Users will need to right-click → Open past the Gatekeeper warning on first launch.
  # Once you have a Developer ID Application cert + notarization credentials, set
  # notarize: true here and add the APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID / CSC_LINK / CSC_KEY_PASSWORD secrets in GitHub (see release.yml).
  notarize: false
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target: AppImage
  icon: assets/icon.png
  category: Development
  synopsis: Git client for game development teams
  description: Lucid Git — LFS, file locking, merge conflict resolution, and Discord notifications purpose-built for Unreal Engine 5 teams.

# ── Auto-update via GitHub Releases ──────────────────────────────────────────
publish:
  provider: github
  owner: Lucid-Rain-Studios
  repo: LUCID_GIT
  releaseType: release
  publishAutoUpdate: true
